services:
###> doctrine/doctrine-bundle ###
  database:
    # Pour accéder à la base MariaDB depuis l'hôte (ex: DBeaver, HeidiSQL),
    # décommenter la ligne ci-dessous.
    # Note : Si XAMPP utilise déjà le port 3306 sur votre machine hôte,
    # mapper vers un port hôte libre (ex: "3307:3306").
    # ports:
    #   - "3307:3306"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
