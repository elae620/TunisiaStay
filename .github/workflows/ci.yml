# =============================================================================
# CI — TunisiaStay
# Pipeline d'intégration continue pour les pull requests et la branche master
# BONUS PDF : Matrice de versions (PHP 8.2 & PHP 8.3)
# =============================================================================

name: CI — TunisiaStay

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1 : Contrôles qualité et tests PHPUnit (Matrice PHP 8.2 & 8.3)
  # ─────────────────────────────────────────────────────────
  checks-and-tests:
    name: "Contrôles & Tests (PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3"]

    env:
      APP_ENV: test
      APP_SECRET: ci-placeholder-secret-not-real
      DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/ci_test?serverVersion=10.11.2-MariaDB&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: "in-memory://"
      MAILER_DSN: "null://null"
      STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
      STRIPE_PUBLIC_KEY: "pk_test_ci_placeholder"

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de PHP ${{ matrix.php-version }} avec extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ctype, iconv, intl, zip, pdo_mysql
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - name: Installation des dépendances PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Préparation du répertoire de rapports
        run: mkdir -p build/test-results

      - name: Exécution des contrôles et tests (scripts/check.sh)
        run: bash scripts/check.sh
        env:
          PHPUNIT_EXTRA_ARGS: "--log-junit build/test-results/phpunit-${{ matrix.php-version }}.xml"

      - name: Upload du rapport PHPUnit (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-report-php${{ matrix.php-version }}
          path: build/test-results/phpunit-${{ matrix.php-version }}.xml
          retention-days: 14
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────
  # Job 2 : Construction de l'image Docker (après succès de la matrice)
  # ─────────────────────────────────────────────────────────
  docker-build:
    name: "Construction image Docker"
    runs-on: ubuntu-latest
    needs: checks-and-tests

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Construction de l'image Docker (ci-SHA)
        run: |
          docker build \
            --tag tunisiastay-app:ci-${{ github.sha }} \
            .

      - name: Vérification de l'image construite
        run: |
          docker image inspect tunisiastay-app:ci-${{ github.sha }} \
            --format 'ID: {{.Id}} | Taille: {{.Size}} octets'
          echo "✔ Image tunisiastay-app:ci-${{ github.sha }} construite avec succès"
